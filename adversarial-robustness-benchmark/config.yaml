# Global configuration for the Adversarial Robustness Benchmark.
# Every script and module reads paths, the seed, and hyperparameters from here.

# Reproducibility: fixed across torch, numpy and Python random.
seed: 42

paths:
  data_root: data
  clean_set: data/clean          # original (unmodified) benchmark images
  poisoned_set: data/poisoned    # generated later (Phase 1) — not built yet
  hf_cache: data/_hf_cache       # downloaded parquet shards
  results: results

# Benchmark dataset — an ImageNet-validation subset.
dataset:
  benchmark_size: 1000           # total images; expandable to 5000 later
  per_class: 1                   # class-balanced: images per ImageNet class
  num_classes: 1000
  # Public, non-gated ImageNet-1k mirror (images pre-resized to 256px).
  hf_repo: evanarlian/imagenet_1k_resized_256
  hf_split: val
  # CIFAR-100 is used only in Phase 4 (defense fine-tuning); torchvision downloads it.
  train_dataset: cifar100

# Primary threat model: L-infinity. Epsilon lives in [0,1] pixel space.
attack:
  threat_model: Linf
  epsilon: 0.03137254901960784    # 8/255
  pgd_step: 0.00784313725490196   # 2/255
  pgd_iters: 20
  fgsm_epsilon: 0.03137254901960784
  # AutoAttack and Square are expensive; evaluate on a class-balanced subset.
  # Built by datasets.loader.load_eval_subset(n, seed=<global seed>), so the
  # same 200 images are selected every run — results are fully reproducible.
  # Because the clean set has 1 image per class and subset < num_classes, the
  # sampler randomly picks `subset` distinct classes (seeded) and takes their
  # one image each — a uniform sample over the label space, NOT classes 0..199.
  # Labels are taken directly from the clean-set manifest (same source as the
  # full evaluation) — no separate label file needed.
  # Disclose in paper: "AutoAttack and Square evaluated on a 200-image
  # class-balanced subset due to compute cost." Set to null for the full 1000.
  autoattack_eval_subset: 200
  square_eval_subset: 200

# The 7 benchmarked architectures (short keys -> wrappers in models/classifiers.py).
models:
  - resnet50
  - vgg16
  - convnext_tiny
  - vit_b_16
  - swin_t
  - efficientnet_b0
  - clip_vit_b16

# RobustBench adversarially-trained model — the robustness-ceiling reference.
robustbench_model:
  name: Salman2020Do_R50
  threat_model: Linf
  dataset: imagenet

# Phase C — defense model (Madry-style PGD adversarial fine-tuning).
#
# FIX (2026-06): train on ALL 1000 ImageNet classes so the training label space
# matches the 1000-class evaluation benchmark. The earlier run trained on only
# the first 100 classes but was scored on all 1000 -> clean accuracy was capped
# near 100/1000 = 10% before any attack (the reported "6% collapse"). That was an
# eval/label-space bug, NOT an inherent limit.
#
# Recommended recipe (results-oriented): adversarially FINE-TUNE the ImageNet-1k
# -pretrained ResNet-50 (train_defense.py loads pretrained weights) — NOT from
# scratch. Fine-tuning keeps clean accuracy high (~60-70%) and reaches PGD
# robustness in the ~25-40% range within a handful of epochs; from-scratch AT on
# ImageNet needs ~90+ epochs on multi-GPU to match. train_defense.py adds a
# cosine LR decay and tracks per-epoch CLEAN accuracy so a collapse is caught early.
defense:
  base_arch: resnet50
  num_classes: 1000             # ALL ImageNet classes (matches the 1000-class eval)
  images_per_class: 300         # ~300k imgs/epoch; raise toward ~1300 to use all
  epochs: 10                    # fine-tune budget (cosine LR decay over these epochs)
  batch_size: 64
  lr: 0.003                     # SGD peak LR for adversarial fine-tune; cosine-decayed to 0.
                                # NOTE: lr=0.01 diverged — full-net AT fine-tune of pretrained
                                # ResNet-50 destroyed clean features in ~150 steps (clean acc
                                # 0.79->chance, loss pinned at ln(1000)). 0.001 verified stable
                                # (clean held 0.81->0.71). 0.003 chosen as a higher peak for
                                # faster robustness build-up — stability INFERRED, not verified,
                                # so watch clean_acc over the first ~150 batches of epoch 1; if it
                                # free-falls toward chance, fall back to 0.001 (--lr 0.001).
                                # If going higher than 0.003, add warmup + clip_grad_norm_ first.
  momentum: 0.9
  weight_decay: 5.0e-4
  # --- recipe-stability knobs (clean-collapse fix) ---
  # freeze_bn: keep BN running_mean/var FROZEN at the pretrained clean stats during
  # the adversarial training forward. Without this, BN drifts toward the adversarial
  # distribution while clean acc (and eval) read the corrupted stats -> clean craters
  # within one epoch at every LR (the single-BN AT pathology). This is the primary fix.
  freeze_bn: true
  # grad_clip_norm: clip the global grad norm (cheap insurance vs early adv-grad spikes).
  # Set to 0 or null to disable.
  grad_clip_norm: 1.0
  pgd_epsilon: 0.03137254901960784   # 8/255 — same as eval threat model
  pgd_alpha: 0.00784313725490196     # 2/255
  pgd_steps: 5                       # cheaper than eval-time PGD-20
  num_workers: 4
  checkpoint_dir: models/checkpoints
  # Training-data location — override with --train-dir on the CLI.
  # Needs the FULL ImageNet-1k train tree (1000 WNID folders). On Kaggle, add the
  # "imagenet-object-localization-challenge" dataset; its train tree is at:
  #   /kaggle/input/imagenet-object-localization-challenge/ILSVRC/Data/CLS-LOC/train
  # NOTE: when added via the Competitions tab the path gains a "competitions/" segment:
  #   /kaggle/input/competitions/imagenet-object-localization-challenge/ILSVRC/Data/CLS-LOC/train
  # The mount path is image-specific — pass the actual one with --train-dir rather than
  # relying on this default.
  train_dir: /kaggle/input/imagenet-object-localization-challenge/ILSVRC/Data/CLS-LOC/train
